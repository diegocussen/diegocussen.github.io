name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter

          REPO_NAME="${{ github.event.workflow_run.repository.name }}"
          OWNER="${{ github.event.workflow_run.repository.owner.login }}"
          if [ "${REPO_NAME}" = "${OWNER}.github.io" ]; then
            BASEURL=""
          else
            BASEURL="/${REPO_NAME}"
          fi

          cat > _config_deploy.yml <<EOF
          baseurl: "${BASEURL}"
          giscus:
            repo: "${{ github.repository }}"
          EOF

          export JEKYLL_ENV=production
          bundle exec jekyll build --config _config.yml,_config_deploy.yml
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # only check local links
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
